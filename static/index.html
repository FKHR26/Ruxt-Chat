<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruxt-Chat</title>
<!-- <link rel="stylesheet" href="style.css"> -->
<link rel="stylesheet" href="styles/addFriendModal.css">
<link rel="stylesheet" href="styles/authScreen.css">
<link rel="stylesheet" href="styles/leftSidebar.css">
<link rel="stylesheet" href="styles/rightPanel.css">
<link rel="stylesheet" href="styles/theme.css">
<link rel="stylesheet" href="styles/bottomLeftTabBar.css">
</head>
<body>
  <div id="authScreen">
    <div id="authBox">
      <h2>Ruxt-Chat</h2>
      <input id="authUsername" placeholder="Username" autocomplete="username">
      <input id="authPassword" placeholder="Password" type="password" autocomplete="current-password">
      <button id="loginBtn">Log in</button>
      <button id="signupBtn">Sign up</button>
      <p id="authError"></p>
    </div>
  </div>

  <div id="app" style="display:none">

    <!-- LEFT: sidebar with tabs + chat list -->
    <div id="sidebar">
      <!-- Chats tab -->
      <div id="tab-chats" class="tab-page">
        <div class="top-bar">
          <h1>Ruxt-Chats</h1>
          <button id="addFriendBtn" class="icon-btn">+</button>
        </div>
        <div id="friendList"></div>
      </div>

      <!-- Status tab -->
      <div id="tab-status" class="tab-page" style="display:none">
        <div class="top-bar"><h1>Status</h1></div>
        <p class="placeholder-text">No status updates yet.</p>
      </div>

      <!-- Calls tab -->
      <div id="tab-calls" class="tab-page" style="display:none">
        <div class="top-bar"><h1>Calls</h1></div>
        <p class="placeholder-text">No call history yet.</p>
      </div>

      <div id="tabBar">
        <button class="tab-btn active" data-tab="chats">Chats</button>
        <button class="tab-btn" data-tab="status">Status</button>
        <button class="tab-btn" data-tab="calls">Calls</button>
      </div>
    </div>

    <!-- RIGHT: either the open chat, or a placeholder -->
    <div id="mainPane">
      <div id="emptyState">
        <p>Open any chat to start conversation</p>
      </div>

      <div id="dmView" style="display:none">
        <div class="top-bar with-back">
          <button id="backBtn" class="icon-btn">&larr;</button>
          <h1 id="dmTitle"></h1>
        </div>
        <div id="messages"></div>
        <div id="input-bar">
          <input id="msgInput" placeholder="Message" autocomplete="off">
          <button id="sendBtn" class="icon-btn">&rarr;</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Add friend modal -->
  <div id="addFriendModal" style="display:none">
    <div id="addFriendBox">
      <h3>Add friend</h3>
      <input id="friendUsername" placeholder="Their username">
      <button id="confirmAddFriend">Add</button>
      <button id="cancelAddFriend">Cancel</button>
      <p id="addFriendError"></p>
    </div>
  </div>

<!-- <script src="script.js"></script> -->
<script src="js/variables.js"></script>
<script src="js/friendList.js"></script>
<script src="js/dmView.js"></script>
<script src="js/tabs.js"></script>
<script src="js/addFriend.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
